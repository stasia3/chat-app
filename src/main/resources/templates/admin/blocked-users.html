<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Blocked users</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" th:href="@{/css/basics.css}">
    <link rel="stylesheet" th:href="@{/css/reports.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="page-shell">

    <div th:replace="~{fragments/navbar_admin :: menu}"></div>

    <main class="page-container">

        <div class="reports-header">
            <div>
                <span class="reports-eyebrow">Admin Center</span>
                <h1>Blocked users</h1>
                <p>View currently blocked users and unblock accounts if needed.</p>
            </div>

            <div class="report-counter">
                <span>Active</span>
                <strong th:text="${blocks.size()}">0</strong>
            </div>
        </div>

        <form class="case-search"
              method="get"
              th:action="@{/admin/blocked-users}">

            <input
                    type="text"
                    name="search"
                    placeholder="Search blocked users..."
                    th:value="${search}">

            <button type="submit">
                Search
            </button>

            <a class="secondary"
               th:href="@{/admin/blocked-users}">
                Clear
            </a>

        </form>

        <div class="report-list">

            <div class="report-card" th:each="block : ${blocks}">

                <div class="report-top">
                    <div>
                        <span class="report-type">BLOCKED USER</span>

                        <h3 th:text="${block.user.username}">
                            username
                        </h3>
                    </div>

                    <span class="status dismissed">BLOCKED</span>
                </div>

                <div class="report-info">
                    <div>
                        <label>Blocked by</label>
                        <span th:text="${block.blockedBy.username}">admin</span>
                    </div>

                    <div>
                        <label>Blocked at</label>
                        <span th:text="${#temporals.format(block.blockedAt,'dd MMM yyyy HH:mm')}">
                            date
                        </span>
                    </div>

                    <div>
                        <label>Reason</label>
                        <span th:text="${block.reason}">Reason</span>
                    </div>
                </div>

                <div class="target-actions">
                    <a th:href="@{/profile/{username}(username=${block.user.username})}">
                        View profile →
                    </a>

                    <a th:if="${block.blockRequest != null}"
                       th:href="@{/admin/block-requests/{id}(id=${block.blockRequest.id})}">
                        View request →
                    </a>

                    <form th:action="@{/admin/blocked-users/{userId}/unblock(userId=${block.user.id})}"
                          method="post">
                        <button class="secondary" type="submit">Unblock</button>
                    </form>
                </div>

            </div>

            <div class="empty" th:if="${blocks.isEmpty()}">
                No active blocked users.
            </div>

        </div>

    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

</body>
</html>
