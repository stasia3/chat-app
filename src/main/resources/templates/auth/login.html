<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · DevPortal</title>
    <link rel="stylesheet" href="/css/basics.css" th:href="@{/css/basics.css}">
</head>

<body>

<div class="page-shell">

    <div class="auth-card">
        <div class="auth-content">
            <div class="logo-big">&lt;|&gt;</div>
            <h1>Welcome back</h1>
            <p class="auth-subtitle">
                Sign in to continue to DevPortal and connect with your programmer space.
            </p>

            <form method="post" th:action="@{/login}" class="auth-form">
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" placeholder="e.g. stasia" autocomplete="username" />
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" />
                </div>

                <div class="actions">
                    <button type="submit" class="cta-btn">Sign in</button>
                    <a class="secondary" th:href="@{/register}">Register</a>
                </div>

                <div th:if="${param.error}" class="message error-box">
                    <strong class="hl-red">Error:</strong> Invalid username or password.
                </div>

                <div th:if="${param.logout}" class="message success-box">
                    <strong class="hl-green">Done:</strong> You have been logged out.
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

</body>
</html>
