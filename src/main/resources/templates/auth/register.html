<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register · DevPortal</title>
    <link rel="stylesheet" href="/css/basics.css" th:href="@{/css/basics.css}">
</head>

<body>
    <div class="page-shell">
        <div class="auth-card">
            <div class="auth-content">
                <div class="logo-big">&lt;|&gt;</div>
                <h1>Create account</h1>

                <p class="auth-subtitle">
                    Join DevPortal and start sharing your projects, ideas, and progress.
                </p>

                <form method="post" th:action="@{/register}" th:object="${user}" class="auth-form">
                    <div class="field">
                        <label for="username">Username</label>
                        <input id="username" type="text" th:field="*{username}" placeholder="e.g. stasia" required>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" type="email" th:field="*{email}" placeholder="e.g. stasia@gmail.com" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" type="password" th:field="*{password}" placeholder="••••••••" required>
                    </div>

                    <div class="field">
                        <label for="password-check">Confirm password</label>
                        <input id="password-check" type="password" th:field="*{passwordCheck}" placeholder="••••••••" required>
                    </div>


                    <div class="actions">
                        <button type="submit" class="cta-btn">Register</button>
                        <a class="secondary" th:href="@{/login}">Log in</a>
                    </div>

                    <div th:if="${error}" class="message error-box">
                        <strong class="hl-red">Error:</strong>
                        <span th:text="${error}"></span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
