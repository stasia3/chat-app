<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chat · DevPortal</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/basics.css" th:href="@{/css/basics.css}">
</head>

<body>

<div class="page-shell">

    <div th:replace="~{fragments/navbar :: menu}"></div>

    <main class="chat-card">

        <div class="chat-header">

            <div>
                <h1>
                    Chat with
                    <span th:text="${selectedUsername}">username</span>
                </h1>

                <p class="auth-subtitle">
                    Simple private conversation between DevPortal friends.
                </p>
            </div>

            <a class="secondary" th:href="@{/users}">
                Back to users
            </a>

        </div>

        <div class="messages-box">

            <div th:if="${#lists.isEmpty(messages)}" class="empty-box">
                <p>No messages yet. Start the conversation.</p>
            </div>

            <div th:each="message : ${messages}"
                 class="message-row"
                 th:classappend="${message.sender.username == currentUsername} ? ' mine' : ' theirs'">

                <div class="message-bubble">

                    <div class="message-meta">
                        <strong th:text="${message.sender.username}">username</strong>
                        <small th:text="${message.timestamp}">time</small>
                    </div>

                    <p th:text="${message.content}">Message content</p>

                </div>

            </div>

        </div>

        <form th:action="@{/chat/{username}(username=${selectedUsername})}"
              method="post"
              class="chat-form">

            <input type="text"
                   name="content"
                   placeholder="Write a message..."
                   required>

            <button type="submit" class="cta-btn">
                Send
            </button>

        </form>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

</body>
</html>
