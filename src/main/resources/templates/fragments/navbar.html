<nav xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
     th:fragment="menu"
     class="navbar">

    <div class="logo">&lt;|&gt; DevPortal</div>

    <div class="nav-links">
        <a class="chip" th:href="@{/profile}">Profile</a>
        <a class="chip" th:href="@{/friends}">Friends</a>
        <a class="chip" th:href="@{/notifications}">Notifications</a>
        <a class="chip" th:href="@{/users}">Open chats</a>
        <a class="chip" th:href="@{/posts}">Posts</a>
        <div sec:authorize="hasRole('ADMIN')">
            <a href="@{/admin}">Admin Panel</a>
        </div>
        <div sec:authorize="hasAnyRole('REPORTER','ADMIN')">
            <a href="@{/reports}">Reports</a>
        </div>

        <form th:action="@{/logout}" method="post">
            <button class="logout-btn" type="submit">Logout</button>
        </form>
    </div>
</nav>
