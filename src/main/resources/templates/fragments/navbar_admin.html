<div class="admin-menu"
     xmlns:th="http://www.thymeleaf.org"
     th:fragment="menu">


    <div class="menu-group">
        <span class="menu-title">User</span>
        <div class="menu-actions">
            <a class="chip" th:href="@{/profile}">Profile</a>
            <a class="chip" th:href="@{/posts}">Posts</a>
            <a class="chip" th:href="@{/notifications}">Notifications</a>
            <a class="chip" th:href="@{/friends}">Friends</a>
            <a class="chip" th:href="@{/chat}">Chat</a>
        </div>
    </div>

    <div class="menu-group">
        <span class="menu-title">Reporter</span>
        <div class="menu-actions">
            <a class="chip" th:href="@{/reports}">Reports</a>
            <a class="chip" th:href="@{/reports/cases}">User cases</a>
        </div>
    </div>

    <div class="menu-group">
        <span class="menu-title">Admin</span>
        <div class="menu-actions">
            <a class="chip active" th:href="@{/admin/block-requests}">Block requests</a>
            <a class="chip" th:href="@{/admin/blocked-users}">Blocked users</a>

            <form th:action="@{/logout}" method="post">
                <button class="logout-btn" type="submit">Logout</button>
            </form>
        </div>
    </div>

</div>
