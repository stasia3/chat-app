<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<article th:fragment="card(postItem)"
         class="feed-post"
         th:id="'post-' + ${postItem.post.id}">

    <div class="feed-post-header">

        <a class="post-author-avatar"
           th:href="@{/profile/{username}(username=${postItem.post.user.username})}">

            <img th:if="${postItem.authorProfileImageUrl != null and !postItem.authorProfileImageUrl.isBlank()}"
                 th:src="@{${postItem.authorProfileImageUrl}}"
                 alt="Profile photo">

            <span th:if="${postItem.authorProfileImageUrl == null or postItem.authorProfileImageUrl.isBlank()}"
                  th:text="${#strings.toUpperCase(#strings.substring(postItem.post.user.username,0,1))}">
                U
            </span>

        </a>

        <div class="post-author-info">

            <div class="post-author-row">
                <strong class="post-author-name"
                        th:text="${postItem.post.user.username}">
                    username
                </strong>

                <span th:if="${postItem.post.languageTag != null and !postItem.post.languageTag.isEmpty()}"
                      class="tag-badge">

                    <i class="fa-solid fa-code"></i>

                    <span th:text="${postItem.post.languageTag}">
                        Java
                    </span>

                </span>

                <span class="visibility-badge">

                    <i th:class="${postItem.post.visibility == T(chat.app.prod.post.PostVisibility).PUBLIC}
                                 ? 'fa-solid fa-globe'
                                 : 'fa-solid fa-lock'">
                    </i>

                    <span th:text="${postItem.post.visibility == T(chat.app.prod.post.PostVisibility).PUBLIC
                                    ? 'Public'
                                    : 'Friends'}">
                        Public
                    </span>

                </span>
            </div>

            <div class="post-date-row">
                <small th:text="${#temporals.format(postItem.post.createdAt, 'dd MMM yyyy • HH:mm')}">
                    date
                </small>

            </div>

        </div>

    </div>

    <div class="post-menu">
        <button type="button" class="post-menu-btn">
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>

        <div class="post-menu-dropdown">

            <button type="button"
                    class="post-report-btn report-trigger"
                    th:data-report-url="@{/report/posts/{postId}(postId=${postItem.post.id})}">
                <i class="fa-solid fa-flag"></i>
                Report
            </button>

            <form th:if="${postItem.post.user.username == username}"
                  th:action="@{/posts/{postId}/delete(postId=${postItem.post.id})}"
                  method="post"
                  onsubmit="return confirm('Are you sure you want to delete this post?');">

                <button type="submit" class="post-delete-btn">
                    <i class="fa-solid fa-trash"></i>
                    Delete post
                </button>

            </form>

        </div>
    </div>
    <div class="feed-content">

        <div class="feed-content-preview">

            <div class="post-content-html"
                 th:utext="${postItem.post.content}">
            </div>

            <div class="feed-content-fade"></div>

        </div>

    </div>

    <div class="post-card-footer">

        <div class="post-card-actions">

            <div class="action-pill like-pill">
                <form class="like-form"
                      th:action="@{/posts/{postId}/like(postId=${postItem.post.id})}"
                      method="post">

                    <button type="submit"
                            class="action-icon-btn like-btn"
                            th:classappend="${postItem.likedByCurrentUser} ? ' liked' : ''"
                            aria-label="Like post">
                        <i th:class="${postItem.likedByCurrentUser}
                             ? 'fa-solid fa-heart like-icon'
                             : 'fa-regular fa-heart like-icon'">
                        </i>
                    </button>
                </form>

                <button type="button"
                        class="action-count-btn likes-list-btn"
                        th:data-url="@{/posts/{postId}/likes(postId=${postItem.post.id})}">
                    <span class="like-count" th:text="${postItem.likeCount}">0</span>
                </button>
            </div>

            <a class="action-pill comment-pill"
               th:href="@{/posts/{postId}(postId=${postItem.post.id})} + '#comments'">

                <i class="fa-solid fa-comment action-icon"></i>
                <span class="comment-count" th:text="${postItem.commentCount}">0</span>
            </a>

        </div>

        <a class="view-post-link"
           th:href="@{/posts/{postId}(postId=${postItem.post.id})}">
            Read more
            <i class="fa-solid fa-arrow-right-long"></i>
        </a>

    </div>

</article>
</body>
</html>
