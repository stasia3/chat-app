<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<article th:fragment="card(postItem)"
         class="feed-post"
         th:id="'post-' + ${postItem.post.id}">

    <div class="feed-post-header">

        <div class="feed-user">

            <div>
                <strong th:text="${postItem.post.user.username}">
                    username
                </strong>

                <div class="feed-meta">

                    <span th:if="${postItem.post.languageTag != null and !postItem.post.languageTag.isEmpty()}"
                          class="tag-badge"
                          th:text="${postItem.post.languageTag}">
                        Java
                    </span>

                    <span class="visibility-badge"
                          th:text="${postItem.post.visibility == T(chat.app.prod.post.PostVisibility).PUBLIC ? 'Public' : 'Friends'}">
                        Public
                    </span>

                </div>

                <small th:text="${postItem.post.createdAt}">
                    date
                </small>
            </div>

        </div>

    </div>

    <div class="feed-content">
        <div class="post-content-html"
             th:utext="${postItem.post.content}">
        </div>
    </div>

    <div class="post-card-footer">

        <div class="post-card-actions">

            <div class="action-pill like-pill">
                <form class="like-form"
                      th:action="@{/posts/{postId}/like(postId=${postItem.post.id})}"
                      method="post">

                    <button type="submit"
                            class="action-icon-btn like-btn"
                            th:classappend="${postItem.likedByCurrentUser} ? ' liked' : ''"
                            aria-label="Like post">
                        <i th:class="${postItem.likedByCurrentUser}
                             ? 'fa-solid fa-heart like-icon'
                             : 'fa-regular fa-heart like-icon'">
                        </i>
                    </button>
                </form>

                <button type="button"
                        class="action-count-btn likes-list-btn"
                        th:data-url="@{/posts/{postId}/likes(postId=${postItem.post.id})}">
                    <span class="like-count" th:text="${postItem.likeCount}">0</span>
                </button>
            </div>

            <a class="action-pill comment-pill"
               th:href="@{/posts/{postId}(postId=${postItem.post.id})} + '#comments'">

                <i class="fa-solid fa-comment action-icon"></i>
                <span class="comment-count" th:text="${postItem.commentCount}">0</span>
            </a>

        </div>

        <a class="view-post-link"
           th:href="@{/posts/{postId}(postId=${postItem.post.id})}">
            View full post
            <i class="fa-solid fa-arrow-right-long"></i>
        </a>

    </div>

</article>

</body>
</html>
