<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Chats · DevPortal</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/basics.css" th:href="@{/css/basics.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="page-shell">

    <div sec:authorize="hasRole('ADMIN')" th:replace="~{fragments/navbar_admin :: menu}"></div>
    <div sec:authorize="hasRole('USER')" th:replace="~{fragments/navbar :: menu}"></div>

    <main class="chat-users-card">

        <div class="friends-header">
            <div class="logo-big">&lt;|&gt;</div>

            <h1>Open chats</h1>

            <p class="auth-subtitle">
                You are logged in as
                <strong th:text="${currentUsername}">username</strong>.
                Choose a friend to start a conversation.
            </p>
        </div>

        <div th:if="${#lists.isEmpty(users)}" class="empty-box">
            <p>No friends available for chat yet.</p>
        </div>

        <div th:if="${!#lists.isEmpty(users)}" class="chat-users-list">

            <a th:each="user : ${users}"
               class="chat-user-item"
               th:href="@{/chat/{username}(username=${user.username})}">

                <div class="friend-avatar">
                    <span th:text="${#strings.substring(user.username,0,1)}">U</span>
                </div>

                <div>
                    <strong th:text="${user.username}">username</strong>
                    <span>Open conversation</span>
                </div>

            </a>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

</body>
</html>
