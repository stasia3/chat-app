<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">My Friends · DevPortal</title>

    <link rel="stylesheet"
          href="/css/basics.css"
          th:href="@{/css/basics.css}">
</head>

<body>

<div class="page-shell">

    <div th:replace="~{fragments/navbar :: menu}"></div>

    <main class="friends-card">

        <div class="friends-header">
            <div>
                <div class="logo-big">&lt;|&gt;</div>
                <h1>My Friends</h1>
                <p class="auth-subtitle">
                    People you are connected with on DevPortal.
                </p>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(friends)}" class="empty-box">
            <p>You have no friends yet.</p>
        </div>

        <div th:if="${!#lists.isEmpty(friends)}" class="friends-list">
            <div th:each="friend : ${friends}" class="friend-item">
                <div class="friend-avatar">
                    <span th:text="${#strings.substring(friend.username, 0, 1)}">U</span>
                </div>

                <div>
                    <strong th:text="${friend.username}">username</strong>
                    <span>DevPortal friend</span>
                </div>
            </div>
        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

</body>
</html>
