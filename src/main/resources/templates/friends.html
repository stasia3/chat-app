<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">Find Friends · DevPortal</title>

    <link rel="stylesheet"
          href="/css/basics.css"
          th:href="@{/css/basics.css}">
</head>

<body>

<div class="page-shell">

    <div th:replace="~{fragments/navbar :: menu}"></div>

    <main class="friends-search-card">

        <div class="friends-header">
            <div class="logo-big">&lt;|&gt;</div>

            <h1>Find friends</h1>

            <p class="auth-subtitle">
                Search for developers and connect with people on DevPortal.
            </p>
        </div>

        <form method="get"
              th:action="@{/friends}"
              class="search-form">

            <input
                    type="text"
                    name="username"
                    placeholder="Search username..."
                    th:value="${search}">

            <button type="submit" class="cta-btn">
                Search
            </button>

        </form>

        <div class="search-results">

            <div th:if="${users != null and #lists.isEmpty(users)}"
                 class="empty-box">
                <p>No users found.</p>
            </div>

            <div th:if="${users != null}"
                 th:each="user : ${users}"
                 class="user-card">

                <div class="user-info">

                    <div class="friend-avatar">
                        <span th:text="${#strings.substring(user.username,0,1)}">
                            U
                        </span>
                    </div>

                    <div>
                        <strong th:text="${user.username}">
                            username
                        </strong>

                        <span>DevPortal developer</span>
                    </div>

                </div>

                <form th:action="@{/friends/request/{username}(username=${user.username})}"
                      method="post">

                    <button type="submit" class="secondary">
                        Send request
                    </button>

                </form>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

</body>
</html>
