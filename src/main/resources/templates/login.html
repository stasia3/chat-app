<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login · DevPortal</title>

    </head>

    <body>
        <nav>
            <div class="nav-links">
                <a class="chip" th:href="@{/}">Home</a>
                <a class="btn btn-primary" th:href="@{/profile}">Profile</a>
            </div>
        </nav>
        <br/>

        <form method="post" th:action="@{/login}">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" placeholder="e.g. stasia" autocomplete="username" />
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" />
            </div>
            <br/>
<!--            <div class="form-row">-->
<!--                <a class="small-link" th:href="@{/register}">Create account</a>-->
<!--                <a class="small-link" th:href="@{/}">Back to home</a>-->
<!--            </div>-->
            <div class="actions">
                <button type="submit">Sign in</button>
                <a class="secondary" th:href="@{/register}">Register</a>
            </div>
            <div th:if="${param.error}" class="error">
                <strong class="hl-red">Error:</strong> Invalid username or password.
            </div>

            <div th:if="${param.logout}" class="error" style="border-color: rgba(34, 197, 94, 0.35); background: rgba(34, 197, 94, 0.08);">
                <strong class="hl-green">Done:</strong> You have been logged out.
            </div>
        </form>

        <!-- FOOTER -->
        <br/>
        <footer>
            <div>
                <span>© DevPortal</span>
                <span class="muted">·</span>
                <span class="tag">v0.1.1</span>
            </div>
        </footer>

    </body>
</html>
