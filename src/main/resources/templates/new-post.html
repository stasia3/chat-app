<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">Add Post</title>
</head>
<body>

<nav>
    <a th:href="@{/profile}">Profile</a>
    <a th:href="@{/posts}">Posts</a>
</nav>

<h1>Create Post</h1>

<form th:action="@{/posts/new}" method="post">
    <textarea name="content" rows="6" cols="50" placeholder="Write something..." required></textarea>
    <br/>
    <button type="submit">Publish</button>
</form>

</body>
</html>
