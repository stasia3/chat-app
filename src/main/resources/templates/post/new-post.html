<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">Add Post · DevPortal</title>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/posts.css}">

    <script th:src="@{/vendor/tinymce/tinymce.min.js}"></script>
</head>

<body>

<div class="page-shell">

    <div th:replace="~{fragments/navbar :: menu}"></div>

    <main class="post-card">

        <div class="post-header">
            <div class="logo-big">&lt;|&gt;</div>

            <h1>Create Post</h1>

            <p class="auth-subtitle">
                Share an idea, progress update, project, or anything from your developer journey.
            </p>
        </div>

        <form th:action="@{/posts/new}" method="post" class="post-form">

            <label for="content">Post content</label>
            <textarea
                    id="content"
                    name="content"
                    placeholder="Write something..."></textarea>

            <label for="languageTag">Language or technology</label>
            <select id="languageTag" name="languageTag">
                <option value="">No specific language</option>
                <option value="Java">Java</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="Other">Other</option>
            </select>

            <label for="customLanguageTag">Custom language / technology</label>
            <input
                    id="customLanguageTag"
                    type="text"
                    name="customLanguageTag"
                    placeholder="Example: Kotlin, Docker, Angular, C++">

            <label for="visibility">Visibility</label>
            <select id="visibility" name="visibility" required>
                <option value="PUBLIC">Public — everyone can see it</option>
                <option value="PRIVATE">Private — only friends can see it</option>
            </select>

            <div class="post-actions">
                <button type="submit" class="cta-btn">
                    Publish
                </button>

                <a class="secondary"
                   th:href="@{/profile}">
                    Cancel
                </a>
            </div>

        </form>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

<script>
    tinymce.init({
        selector: '#content',
        license_key: 'gpl',
        height: 320,
        menubar: false,
        plugins: 'lists link code codesample',
        toolbar: 'undo redo | bold italic | bullist numlist | link | codesample | code',
        branding: false
    });

    document.querySelector(".post-form").addEventListener("submit", function (event) {
        tinymce.triggerSave();

        const content = document.querySelector("#content").value.trim();

        if (!content) {
            event.preventDefault();
            alert("Please write something before publishing.");
        }
    });
</script>

</body>
</html>
