<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">Posts · DevPortal</title>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/posts.css}">
</head>

<body>

<div class="page-shell">

    <div th:replace="~{fragments/navbar :: menu}"></div>

    <main class="posts-card">

        <div class="posts-header">
            <div class="logo-big">&lt;|&gt;</div>

            <h1>All Posts</h1>

            <p class="auth-subtitle">
                Explore updates, ideas, and progress shared by developers.
            </p>
        </div>

        <div class="posts-actions">
            <a class="cta-btn"
               th:href="@{/posts/new}">
                Create post
            </a>
        </div>

        <div th:if="${#lists.isEmpty(posts)}"
             class="empty-box">
            <p>No posts yet.</p>
        </div>

        <div class="posts-feed">
            <th:block th:each="postItem : ${posts}">
                <article th:replace="~{fragments/post-card :: card(postItem=${postItem})}"></article>
            </th:block>
        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

</body>
</html>
