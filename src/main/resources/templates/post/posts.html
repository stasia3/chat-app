<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title}">Posts · DevPortal</title>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/posts.css}">
    <link rel="stylesheet" th:href="@{/css/report.css}">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

<div class="page-shell">

    <div th:replace="~{fragments/navbar :: menu}"></div>

    <main class="posts-card">



        <div class="posts-toolbar">

            <form th:action="@{/posts}" method="get" class="posts-filter-form">

                <div class="posts-search">
                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text"
                           name="keyword"
                           placeholder="Search posts..."
                           th:value="${keyword}">
                </div>

                <select name="visibility">
                    <option value="ALL" th:selected="${visibility == 'ALL'}">All posts</option>
                    <option value="PUBLIC" th:selected="${visibility == 'PUBLIC'}">Public</option>
                    <option value="PRIVATE" th:selected="${visibility == 'PRIVATE'}">Friends</option>
                </select>

                <select name="language">
                    <option value="ALL" th:selected="${language == 'ALL'}">All languages</option>
                    <option value="Java" th:selected="${language == 'Java'}">Java</option>
                    <option value="JavaScript" th:selected="${language == 'JavaScript'}">JavaScript</option>
                    <option value="Python" th:selected="${language == 'Python'}">Python</option>
                    <option value="HTML" th:selected="${language == 'HTML'}">HTML</option>
                    <option value="CSS" th:selected="${language == 'CSS'}">CSS</option>
                </select>

                <button type="submit" class="secondary">
                    <i class="fa-solid fa-filter"></i>
                    Filter
                </button>

                <a th:href="@{/posts}" class="secondary clear-filter-btn">
                    <i class="fa-solid fa-rotate-left"></i>
                    Clear
                </a>

            </form>

            <a class="cta-btn" th:href="@{/posts/new}">
                Create post
            </a>

        </div>

        <div th:if="${#lists.isEmpty(posts)}"
             class="empty-box">
            <p>No posts yet.</p>
        </div>

        <div class="posts-feed">
            <th:block th:each="postItem : ${posts}">
                <article th:replace="~{fragments/post-card :: card(postItem=${postItem})}"></article>
            </th:block>
        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</div>
    <script th:src="@{/js/likes.js}"></script>

    <div id="likesModal" class="likes-modal-overlay hidden">
        <div class="likes-modal">
            <div class="likes-modal-header">
                <h3>Liked by</h3>
                <button type="button" id="closeLikesModal" class="likes-modal-close">×</button>
            </div>

            <div id="likesModalBody" class="likes-modal-body">
            </div>
        </div>
    </div>

    <script th:src="@{/js/liked-users.js}"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            hljs.highlightAll();
        });

    document.addEventListener("click", function (event) {
        const menuBtn = event.target.closest(".post-menu-btn");

        document.querySelectorAll(".post-menu.open").forEach(menu => {
            if (!menu.contains(event.target)) {
                menu.classList.remove("open");
            }
        });

        if (menuBtn) {
            event.preventDefault();
            event.stopPropagation();

            const menu = menuBtn.closest(".post-menu");
            menu.classList.toggle("open");
        }
    });
</script>
<script th:src="@{/js/post-preview.js}"></script>

<div th:replace="~{fragments/report-modal :: reportModal}"></div>
<script th:src="@{/js/report-modal.js}"></script>
</body>
</html>
