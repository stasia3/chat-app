<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title th:text="${title}">View Post · DevPortal</title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/posts.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

<div class="page-shell">

    <div th:replace="~{fragments/navbar :: menu}"></div>

    <main class="posts-card">

        <div class="posts-header">
            <a class="back-link" th:href="@{/posts}">
                <i class="fa-solid fa-arrow-left"></i>
                Back to feed
            </a>
        </div>

        <article class="post-detail-card">



            <div class="feed-post-header">

                <a class="post-author-avatar"
                   th:href="@{/profile/{username}(username=${postItem.post.user.username})}">

                    <img th:if="${postItem.authorProfileImageUrl != null and !postItem.authorProfileImageUrl.isBlank()}"
                         th:src="@{${postItem.authorProfileImageUrl}}"
                         alt="Profile photo">

                    <span th:if="${postItem.authorProfileImageUrl == null or postItem.authorProfileImageUrl.isBlank()}"
                          th:text="${#strings.toUpperCase(#strings.substring(postItem.post.user.username,0,1))}">
        U
    </span>

                </a>

                <div class="post-author-info">

                    <div class="post-author-row">
                        <strong class="post-author-name"
                                th:text="${postItem.post.user.username}">
                            username
                        </strong>

                        <span th:if="${postItem.post.languageTag != null and !postItem.post.languageTag.isEmpty()}"
                              class="tag-badge">
                    <i class="fa-solid fa-code"></i>
                    <span th:text="${postItem.post.languageTag}">Java</span>
                </span>

                        <span class="visibility-badge">
                    <i th:class="${postItem.post.visibility == T(chat.app.prod.post.PostVisibility).PUBLIC}
                                 ? 'fa-solid fa-globe'
                                 : 'fa-solid fa-lock'">
                    </i>

                    <span th:text="${postItem.post.visibility == T(chat.app.prod.post.PostVisibility).PUBLIC
                                    ? 'Public'
                                    : 'Friends'}">
                        Public
                    </span>
                </span>
                    </div>

                    <div class="post-date-row">
                        <small th:text="${#temporals.format(postItem.post.createdAt, 'dd MMM yyyy • HH:mm')}">
                            date
                        </small>
                    </div>

                </div>

            </div>

            <div class="post-detail-content">
                <div class="post-content-html"
                     th:utext="${postItem.post.content}">
                </div>
            </div>

            <div class="post-detail-actions">

                <div class="post-card-actions">

                    <div class="action-pill like-pill">
                        <form class="like-form"
                              th:action="@{/posts/{postId}/like(postId=${postItem.post.id})}"
                              method="post">

                            <button type="submit"
                                    class="action-icon-btn like-btn"
                                    th:classappend="${postItem.likedByCurrentUser} ? ' liked' : ''"
                                    aria-label="Like post">

                                <i th:class="${postItem.likedByCurrentUser}
                             ? 'fa-solid fa-heart like-icon'
                             : 'fa-regular fa-heart like-icon'">
                                </i>
                            </button>
                        </form>

                        <button type="button"
                                class="action-count-btn likes-list-btn"
                                th:data-url="@{/posts/{postId}/likes(postId=${postItem.post.id})}">
                            <span class="like-count" th:text="${postItem.likeCount}">0</span>
                        </button>
                    </div>

                    <a class="action-pill comment-pill"
                       href="#comments">
                        <i class="fa-solid fa-comment action-icon"></i>
                        <span class="comment-count" th:text="${postItem.commentCount}">0</span>
                    </a>

                </div>

            </div>

        </article>

        <section id="comments" class="comments-section">

            <div class="comments-header">
                <h2>Write a comment</h2>
            </div>

            <form class="comment-form"
                  th:action="@{/posts/{postId}/comments(postId=${postItem.post.id})}"
                  method="post">

                <div class="comment-input-card">


                    <div class="comment-avatar">

                        <img th:if="${currentUserImageUrl != null and !currentUserImageUrl.isBlank()}"
                             th:src="@{${currentUserImageUrl}}"
                             alt="Profile photo">

                        <span th:if="${currentUserImageUrl == null or currentUserImageUrl.isBlank()}"
                              th:text="${#strings.toUpperCase(#strings.substring(username,0,1))}">
                            U
                        </span>

                    </div>

                    <div class="comment-input-area">

            <textarea name="content"
                      placeholder="Write your comment..."
                      required></textarea>

                        <div class="comment-form-footer">



                            <button type="submit" class="cta-btn">
                                <i class="fa-solid fa-paper-plane"></i>
                                Post comment
                            </button>

                        </div>

                    </div>

                </div>

            </form>
<!--        <section id="comments" class="comments-section">-->

            <div class="comments-header comments-list-title">
                <h2>
                    Comments
                    <span th:text="${postItem.commentCount}">0</span>
                </h2>
            </div>

            <div th:if="${#lists.isEmpty(comments)}" class="empty-box">
                <p>No comments yet. Be the first to comment.</p>
            </div>

            <div class="comments-list">
                <article th:each="commentItem : ${comments}" class="comment-card">

                    <a class="comment-avatar"
                       th:href="@{/profile/{username}(username=${commentItem.comment.user.username})}">

                        <img th:if="${commentItem.authorProfileImageUrl != null and !commentItem.authorProfileImageUrl.isBlank()}"
                             th:src="@{${commentItem.authorProfileImageUrl}}"
                             alt="Profile photo">

                        <span th:if="${commentItem.authorProfileImageUrl == null or commentItem.authorProfileImageUrl.isBlank()}"
                              th:text="${#strings.toUpperCase(#strings.substring(commentItem.comment.user.username,0,1))}">
        U
    </span>

                    </a>

                    <div class="comment-body">
                        <div class="comment-top">
                            <strong th:text="${commentItem.comment.user.username}">username</strong>

                            <small th:text="${#temporals.format(commentItem.comment.createdAt, 'dd MMM yyyy • HH:mm')}">
                                date
                            </small>
                        </div>

                        <p th:text="${commentItem.comment.content}">
                            Comment text
                        </p>

                        <form th:if="${commentItem.comment.user.username == username or postItem.post.user.username == username}"
                              th:action="@{/posts/{postId}/comments/{commentId}/delete(
          postId=${postItem.post.id},
          commentId=${commentItem.comment.id}
      )}"
                              method="post"
                              class="comment-delete-form"
                              onsubmit="return confirm('Are you sure you want to delete this comment?');">

                            <button type="submit" class="comment-delete-btn">
                                <i class="fa-solid fa-trash"></i>
                                Delete
                            </button>
                        </form>
                    </div>

                </article>
            </div>

        </section>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</div>

<div id="likesModal" class="likes-modal-overlay hidden">
    <div class="likes-modal">
        <div class="likes-modal-header">
            <h3>Liked by</h3>
            <button type="button" id="closeLikesModal" class="likes-modal-close">×</button>
        </div>

        <div id="likesModalBody" class="likes-modal-body"></div>
    </div>
</div>

<script th:src="@{/js/likes.js}"></script>
<script th:src="@{/js/liked-users.js}"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            hljs.highlightAll();
        });
    </script>
    <script th:src="@{/js/post-preview.js}"></script>
</body>
</html>
