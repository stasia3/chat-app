<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">Profile · DevPortal</title>
</head>

<body>
    <nav>
        <div class="nav-links">
            <a class="chip" th:href="@{/}">Home</a>
            <a class="btn btn-violet" th:href="@{/profile}">Profile</a>
            <a th:href="@{/friends}">Friends</a>
            <a th:href="@{/notifications}">Notifications</a>
            <a href="/users">Open chats</a>
            <a th:href="@{/posts}">Posts</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button class="btn btn-green" type="submit">Logout</button>
            </form>
        </div>
    </nav>



    <h1>Welcome, <span th:text="${username}"></span></h1>
    <p>You have loged in</p>

    <div>
        <span>Total friends: <b th:text="${friendCount}"></b></span>
        <a th:href="@{/friends/list}">View all friends</a>
    </div>

    <br/>

    <div>
        <a th:href="@{/posts/new}">Add a post</a>
    </div>

    <br/>

    <h2>My posts</h2>

    <div th:if="${#lists.isEmpty(posts)}">
        <p>You have not published any posts yet.</p>
    </div>

    <div th:each="post : ${posts}" style="margin-bottom: 20px; border: 1px solid #ccc; padding: 10px;">
        <div>
            <span th:text="${post.content}"></span>
        </div>
        <div>
            <small th:text="${post.createdAt}"></small>
        </div>
    </div>

    <br/>


    <!-- FOOTER -->
        <br/>
    <footer>
        <div>
            <span>© DevPortal</span>
            <span class="muted">·</span>
            <span class="tag">v0.1.1</span>
        </div>
    </footer>
</body>
</html>
