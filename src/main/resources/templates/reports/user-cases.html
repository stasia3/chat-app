<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>User cases</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" th:href="@{/css/basics.css}">
    <link rel="stylesheet" th:href="@{/css/reports.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="page-shell">

    <div sec:authorize="hasRole('ADMIN')" th:replace="~{fragments/navbar_admin :: menu}"></div>
    <div sec:authorize="hasAnyRole('REPORTER')" th:replace="~{fragments/navbar_reporter :: menu}"></div>

    <main class="page-container">

        <div class="reports-header">
            <div>
                <span class="reports-eyebrow">Moderation Center</span>
                <h1>User cases</h1>
                <p>View reported users and their moderation history.</p>
            </div>

            <div class="report-counter">
                <span>Total</span>
                <strong th:text="${cases.size()}">0</strong>
            </div>
        </div>

        <form class="case-search"
              method="get"
              th:action="@{/reports/cases}">

            <input type="text"
                   name="search"
                   placeholder="Search user cases..."
                   th:value="${search}">

            <button type="submit">Search</button>

            <a class="secondary"
               th:href="@{/reports/cases}">
                Clear
            </a>

        </form>

        <div class="case-list">

            <a class="case-card"
               th:each="userCase : ${cases}"
               th:href="@{/reports/cases/{id}(id=${userCase.id})}">

                <div class="case-main">
                    <div class="case-avatar"
                         th:text="${#strings.substring(userCase.user.username, 0, 1).toUpperCase()}">
                        U
                    </div>

                    <div>
                        <h3 th:text="${userCase.user.username}">username</h3>
                        <p>
                            Created
                            <span th:text="${#temporals.format(userCase.createdAt,'dd MMM yyyy HH:mm')}">
                                date
                            </span>
                        </p>
                    </div>
                </div>

                <div class="case-meta">
                    <span class="status open"
                          th:classappend="${userCase.status.name().toLowerCase()}"
                          th:text="${userCase.status}">
                        OPEN
                    </span>

                    <span class="open-arrow">Open →</span>
                </div>

            </a>

            <div class="empty" th:if="${cases.isEmpty()}">
                No user cases found.
            </div>

        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>



</body>
</html>
